services:
  - type: web
    name: simon-morin-agent-location
    region: ohio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: simon-morin-location-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_TIME_ZONE
        value: America/Toronto
      - key: PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://simon-morin-agent-location.onrender.com
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_REDIRECT_URI
        value: https://simon-morin-agent-location.onrender.com/api/integrations/meta/facebook/callback
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_DRY_RUN
        value: "true"

databases:
  - name: simon-morin-location-db
    region: ohio
    plan: free
